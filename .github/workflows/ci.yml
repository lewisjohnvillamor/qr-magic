name: CI

on:
  # Pushes to a branch with an open pull request are already covered by the
  # `pull_request` trigger. Listening to both ran the whole suite twice on the
  # same commit — including the seven-minute decode matrix — so `push` is
  # scoped to main, where it is the post-merge check.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run test -- --coverage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  qr-reliability:
    name: QR decode matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # The build gate: if the rendered code cannot be decoded, the release is
      # not shippable, however good it looks.
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Advisory, not a gate — deliberately.
      #
      # `npm audit` asks the bulk advisory endpoint and falls back to a "quick"
      # one that npm is retiring. That fallback answers a tree this size with a
      # 400 ("Invalid package tree") after hanging for several minutes, and it
      # is intermittent: the same command on the same lockfile succeeds one
      # minute and fails the next, with or without `--omit=dev`. A check that
      # red-lights at random blocks every merge while saying nothing about the
      # dependencies, which is worse than not having it.
      #
      # The lockfile is not the problem. `npm ci` above audits it through the
      # working endpoint and prints the count, so the number is still in this
      # job's log on every run.
      #
      # Durable alerting belongs in Dependabot (Settings → Code security),
      # which watches the lockfile continuously and depends on neither this
      # endpoint nor CI running at all.
      - name: Audit dependencies (advisory)
        continue-on-error: true
        timeout-minutes: 2
        run: npm audit --audit-level=high
