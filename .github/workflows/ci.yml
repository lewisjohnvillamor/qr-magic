name: CI

on:
  # Pushes to a branch with an open pull request are already covered by the
  # `pull_request` trigger. Listening to both ran the whole suite twice on the
  # same commit — including the seven-minute decode matrix — so `push` is
  # scoped to main, where it is the post-merge check.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run test -- --coverage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  qr-reliability:
    name: QR decode matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # The build gate: if the rendered code cannot be decoded, the release is
      # not shippable, however good it looks.
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The gate: the packages that actually reach a visitor.
      #
      # This used to audit the whole tree, and stopped working when npm retired
      # the "quick audit" endpoint — `npm audit` falls back to it for a tree
      # this size and now gets a 400 ("Invalid package tree"), after hanging for
      # six minutes. The lockfile is fine: `npm ci` above audits it through the
      # bulk endpoint and reports the count, and this same lockfile passed the
      # old command a day earlier.
      #
      # Scoped to production dependencies, the tree is small enough for the
      # bulk endpoint and the command returns immediately. That is also the set
      # worth blocking a merge on: this ships as a static site, so nothing in
      # devDependencies is ever served to anyone.
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

      # Build tooling still gets looked at, but a retired registry endpoint
      # must not be able to block a merge on its own.
      - name: Audit build tooling (informational)
        continue-on-error: true
        run: npm audit --audit-level=high
