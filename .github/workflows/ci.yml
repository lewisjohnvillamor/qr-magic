name: CI

on:
  # Pushes to a branch with an open pull request are already covered by the
  # `pull_request` trigger. Listening to both ran the whole suite twice on the
  # same commit — including the seven-minute decode matrix — so `push` is
  # scoped to main, where it is the post-merge check.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Advisory, not a gate — deliberately.
      #
      # `npm audit` asks the bulk advisory endpoint and falls back to a "quick"
      # one that npm is retiring. That fallback now answers a tree this size
      # with a 400 ("Invalid package tree"), after hanging for several minutes,
      # and it is intermittent: the same command on the same lockfile succeeds
      # one minute and fails the next. A check that red-lights at random blocks
      # every merge while telling you nothing about your dependencies, which is
      # strictly worse than no check.
      #
      # The lockfile is not the problem. `npm ci` above audits it through the
      # working endpoint and prints the count, so the number is still in this
      # job's log on every run.
      #
      # Durable vulnerability alerting belongs in Dependabot (Settings →
      # Code security), which watches the lockfile continuously and does not
      # depend on this endpoint or on CI running at all.
      - name: Audit dependencies (advisory)
        continue-on-error: true
        timeout-minutes: 2
        run: npm audit --audit-level=high
